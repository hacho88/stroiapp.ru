<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCart Theme Manager — StroiApp</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f5f5f7; color: #1a1a2e; }
        .app { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h1 { font-size: 16px; font-weight: 700; }
        .sidebar-header p { font-size: 12px; opacity: 0.6; margin-top: 4px; }
        .nav { padding: 10px; }
        .nav button { width: 100%; padding: 10px 14px; margin-bottom: 4px; border: none; background: transparent; color: #fff; text-align: left; cursor: pointer; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
        .nav button:hover, .nav button.active { background: rgba(255,255,255,0.1); }
        .nav button .icon { font-size: 18px; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { height: 52px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 20px; gap: 10px; }
        .toolbar h2 { font-size: 15px; font-weight: 600; flex: 1; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-primary { background: #FF4F00; color: #fff; }
        .btn-primary:hover { background: #E04500; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-success { background: #10B981; color: #fff; }
        .workspace { flex: 1; display: flex; overflow: hidden; }
        .file-tree { width: 280px; background: #fff; border-right: 1px solid #e5e5e5; overflow-y: auto; padding: 10px; }
        .file-tree h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #999; margin-bottom: 10px; padding: 0 8px; }
        .tree-item { padding: 6px 10px; cursor: pointer; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: background 0.15s; }
        .tree-item:hover { background: #f5f5f5; }
        .tree-item.active { background: #FFF0E6; color: #FF4F00; font-weight: 600; }
        .tree-item .ficon { font-size: 14px; opacity: 0.6; }
        .tree-item.active .ficon { opacity: 1; }
        .editor-wrap { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .editor-tabs { display: flex; background: #f8f8f8; border-bottom: 1px solid #e5e5e5; }
        .editor-tab { padding: 10px 20px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
        .editor-tab.active { border-bottom-color: #FF4F00; color: #FF4F00; font-weight: 600; }
        .editor-body { flex: 1; display: flex; }
        .code-editor { flex: 1; padding: 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; border: none; outline: none; resize: none; background: #fafafa; tab-size: 4; }
        .preview-pane { width: 50%; border-left: 1px solid #e5e5e5; display: flex; flex-direction: column; }
        .preview-header { padding: 10px 16px; background: #f8f8f8; border-bottom: 1px solid #e5e5e5; font-size: 12px; font-weight: 600; color: #666; display: flex; justify-content: space-between; }
        .preview-frame { flex: 1; border: none; width: 100%; }
        .status-bar { height: 28px; background: #1a1a2e; color: rgba(255,255,255,0.6); font-size: 12px; display: flex; align-items: center; padding: 0 16px; gap: 20px; }
        .status-bar .ok { color: #10B981; }
        .status-bar .err { color: #EF4444; }
        .loading { padding: 40px; text-align: center; color: #999; }
        .error-box { background: #FEF2F2; color: #991B1B; padding: 12px 16px; border-radius: 8px; margin: 10px; font-size: 13px; }
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #999; gap: 12px; }
        .folder-group { margin-bottom: 16px; }
        .folder-label { padding: 4px 8px; font-size: 12px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="designer.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
