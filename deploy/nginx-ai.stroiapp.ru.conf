# nginx config for ai.stroiapp.ru (AI StroiApp Manager)
# Frontend: static React build, Backend: FastAPI via uvicorn on 127.0.0.1:8000

server {
    listen 80;
    server_name ai.stroiapp.ru;

    # Allow large uploads (costs import, images)
    client_max_body_size 50m;

    # Frontend static (Vite build)
    root /var/www/ai-manager/repo/frontend/dist;
    index index.html;

    # SPA fallback (HTML always fresh - hashed assets are cached separately)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # API -> uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # FastAPI docs
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;
}
